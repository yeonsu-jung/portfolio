<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobra Rearing</title>
  <meta name="description" content="Interactive 3-D replay of a 16-link elastic chain rearing into a cobra pose under a policy trained by reinforcement learning." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --panel: rgba(13, 17, 23, 0.78);
      --border: rgba(255, 255, 255, 0.10);
      --text: #c9d1d9;
      --strong: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --control: rgba(255, 255, 255, 0.07);
      --control-hover: rgba(255, 255, 255, 0.14);
      --series-1: #3987e5;
      --series-2: #d95926;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: rgba(255, 255, 255, 0.86);
      --border: rgba(11, 11, 11, 0.13);
      --text: #3d4249;
      --strong: #0b0b0b;
      --muted: #6e7781;
      --accent: #0969da;
      --control: rgba(11, 11, 11, 0.05);
      --control-hover: rgba(11, 11, 11, 0.10);
      --series-1: #2a78d6;
      --series-2: #eb6834;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', ui-monospace, 'DejaVu Sans Mono', monospace;
      font-size: 12px;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .strong { color: var(--strong); font-weight: 600; }

    /* A short stroke in the series colour: identifies a pane / a chart line */
    .key {
      display: inline-block;
      width: 14px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    select, button {
      font: inherit;
      color: var(--strong);
      background: var(--control);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    button:hover, select:hover { background: var(--control-hover); }
    button:active { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    select option { background: var(--bg); color: var(--strong); }
    input[type=checkbox] { accent-color: var(--accent); }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--control-hover);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Pane headers (run selector per 3D view) ── */
    .head {
      position: fixed;
      top: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 380px;
    }
    .head .row { display: flex; align-items: center; gap: 8px; }
    .head select { font-size: 13px; font-weight: 600; min-width: 0; max-width: 100%; }
    .head .phase { color: var(--strong); font-size: 11px; line-height: 1.5; min-height: 1.5em; font-variant-numeric: tabular-nums; }

    /* ── What the run is (a caption along the bottom of its pane, collapsible) ── */
    .about {
      position: fixed;
      padding: 7px 10px;
      max-width: 560px;
    }
    .about summary { color: var(--muted); font-size: 11px; cursor: pointer; user-select: none; }
    .about[open] summary { margin-bottom: 3px; }

    #divider {
      position: fixed;
      top: 0;
      left: 50%;
      width: 1px;
      background: var(--border);
      display: none;
    }

    /* ── Settings (top-right, collapsible) ── */
    #settings {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 256px;
      padding: 8px 12px;
    }
    #settings:not([open]) { width: auto; }
    #settings summary { color: var(--muted); cursor: pointer; user-select: none; }
    #settings .body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 8px;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .field > span:first-child { color: var(--muted); white-space: nowrap; }
    .field select, .field input[type=range] { flex: 1; min-width: 0; }
    .val { color: var(--strong); min-width: 30px; text-align: right; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
    .checks label { display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
    .btns { display: flex; gap: 6px; }
    .btns button { flex: 1; padding: 4px 0; }

    #legend { display: flex; flex-direction: column; gap: 3px; min-height: 30px; justify-content: center; }
    #legend .ramp { height: 8px; border-radius: 2px; }
    #legend .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

    /* ── Status overlay ── */
    #status {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 26px;
      font-size: 13px;
      color: var(--strong);
      white-space: pre-line;
      max-width: min(520px, calc(100vw - 28px));
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #status.hidden { opacity: 0; }

    /* ── Bottom controls: metric plot, scrubber, transport ── */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 16px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #chart-row { display: flex; align-items: center; gap: 14px; }
    #chart-row .field select { flex: none; }
    #chart-legend { display: flex; gap: 18px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    #chart-legend > span { display: inline-flex; align-items: center; gap: 7px; }
    #chart-wrap { height: 60px; }
    #chart { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    #tip {
      position: absolute;
      bottom: 100%;
      margin-bottom: 6px;
      padding: 6px 9px;
      display: none;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
      white-space: nowrap;
      background: var(--bg);
    }
    #tip > span { display: flex; align-items: center; gap: 7px; }

    /* thumb centre travels across the plot area of the chart above (44px .. width - 14px) */
    #scrubber { margin: 2px 7px 2px 37px; }

    #btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #btn-row button {
      width: 34px;
      height: 30px;
      padding: 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #time-label { color: var(--strong); font-weight: 600; margin-left: 6px; font-variant-numeric: tabular-nums; }
    #frame-label { color: var(--muted); font-variant-numeric: tabular-nums; }
    #speed-row { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); }
    #speed-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; margin-right: 8px; }

    @media (max-width: 640px) {
      #chart-legend { display: none; }
      #frame-label { display: none; }
      .head { max-width: calc(100vw - 28px); }
    }
  </style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

window.VIEWER_STARTED = true;
const $ = id => document.getElementById(id);

// ── Embedded data ─────────────────────────────────────────────────────────
// { page, models, runs } written by scripts/make_replay_viewers.py (chain.viewer_export).
// A run is a model (kinematic tree + shapes) and its recorded joint coordinates; the
// page does the forward kinematics, so links stay attached at any playback time.
const DATA = window.REPLAY || { page: {}, models: {}, runs: [] };
const PAGE = DATA.page;
const RUNS = DATA.runs.map(e => ({
  m: e.manifest, raw: e, model: DATA.models[e.manifest.model],
  q: null, series: {}, times: null, trail: null, ready: null,
}));
const METRICS = PAGE.metrics || {};
const VIEWS = PAGE.views || [{ id: 'iso', label: 'Iso', dir: [0.74, -0.6, 0.3] }];
const COLOR_MODES = PAGE.colors || [{ id: 'model', label: 'Model' }];

// series: one colour per pane (plot lines); ramp: low → high magnitude
const THEMES = {
  dark: {
    bg: '#0d1117', plate: '#1a212b', edge: '#59636e', dim: '#1c222b', pick: '#ffd33d', grid: '#262c36',
    line: '#3a4350', trail: '#ffd33d', hit: '#3fb950',
    series: ['#3987e5', '#d95926'],
    ramp: ['#184f95', '#2a78d6', '#5598e7', '#86b6ef', '#cde2fb'],
  },
  light: {
    bg: '#ffffff', plate: '#eef0f3', edge: '#8c959f', dim: '#e3e6ea', pick: '#cf222e', grid: '#e4e7eb',
    line: '#c9cfd6', trail: '#bf5b04', hit: '#1a7f37',
    series: ['#2a78d6', '#eb6834'],
    ramp: ['#86b6ef', '#5598e7', '#2a78d6', '#1c5cab', '#0d366b'],
  },
};

function fmt(key) {
  const d = METRICS[key], unit = !d.unit ? '' : d.unit === '°' ? '°' : ' ' + d.unit;
  return v => {
    if (!Number.isFinite(v)) return '–';
    if (d.adaptive) {                                           // a length, in the unit that reads best
      const a = Math.abs(v);
      return a < 1e-4 ? `${(1e6 * v).toFixed(1)} µm` : a < 0.1 ? `${(1e3 * v).toFixed(1)} mm` : `${v.toFixed(2)} m`;
    }
    const s = v.toFixed(d.digits ?? 2);
    return (+s === 0 ? s.replace('-', '') : s) + unit;          // no "-0.00"
  };
}

function buildLut(stops) {
  const lut = new Float32Array(256 * 3);
  const a = new THREE.Color(), b = new THREE.Color();
  for (let i = 0; i < 256; i++) {
    const x = i / 255 * (stops.length - 1);
    const j = Math.min(Math.floor(x), stops.length - 2);
    a.set(stops[j]).lerp(b.set(stops[j + 1]), x - j);
    lut.set([a.r, a.g, a.b], i * 3);
  }
  return lut;
}

// ── State ─────────────────────────────────────────────────────────────────
const state = {
  time:      0,        // simulation time [s]
  playing:   true,
  speed:     PAGE.speed || 1,      // simulated seconds per second
  loop:      true,
  color:     COLOR_MODES[0].id,
  metric:    PAGE.metric || Object.keys(METRICS)[0],
  thickness: 1,
  floor:     !!PAGE.floor && PAGE.floor.show !== false,
  shadows:   true,
  theme:     'dark',
  toggles:   Object.fromEntries((PAGE.toggles || []).map(t => [t.id, t.on !== false])),
};
const panes = [];
let theme = THEMES.dark, lut = null, dimLin = null, pickLin = null, bgLin = null, trailLin = null, hitLin = null;
let dirty = true;
let hoverTime = null;     // time under the pointer on the plot
// px of a pane taken by the panels over it: its header at the top, its caption at the bottom,
// and (single pane) the open settings panel on the right.  The scene is centred in the rest.
let topInset = 0, bottomInset = 0, sideInset = 0;

// ── Renderer, camera, controls ────────────────────────────────────────────
const canvas   = $('canvas');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  showStatus('This browser cannot draw the 3D view (WebGL is not available).');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const camera = new THREE.PerspectiveCamera(35, 1, 0.02, 100);
camera.up.set(0, 0, 1);               // the simulations are z-up

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.addEventListener('change', () => { dirty = true; });
controls.addEventListener('end', saveHash);

const raycaster = new THREE.Raycaster();
const forward   = new THREE.Vector3();
const tmpV      = new THREE.Vector3();
const tmpC      = new THREE.Color();

const MIN_WIDTH_PX = 1.4;     // links are never drawn thinner than this on screen
const TRAIL_MAX    = 720;     // segments of the trail line

// ── Decoding and kinematics ───────────────────────────────────────────────
// No DOM and no three.js from here to the end of this block: tests/test_viewer_export.py
// runs it under node, against chain.viewer_export (the same steps in numpy) and MuJoCo.
async function inflate(b64) {
  const bin   = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Inverse of chain.viewer_export.pack_frames(): the inflated bytes → zigzag codes → running
// sums in time (modulo 2^16) → coordinate = lo + step * code.  Result: q[frame * nq + i].
function unpackFrames(bytes, rec) {
  const nq = rec.n, n = bytes.length >> 1;
  const code = new Uint16Array(n);
  for (let i = 0; i < n; i++) {
    const z = bytes[i] | (bytes[n + i] << 8);
    code[i] = (z >>> 1) ^ -(z & 1);
  }
  for (let i = nq; i < n; i++) code[i] += code[i - nq];
  const q = new Float32Array(n);
  for (let i = 0; i < n; i++) q[i] = rec.lo[i % nq] + rec.step[i % nq] * code[i];
  return q;
}

// Flat arrays for one model: per body its parent, fixed offset from the parent, and joints.
function compile(model) {
  const nb = model.bodies.length;
  const kin = { nb, parent: new Int32Array(nb), bpos: new Float64Array(nb * 3), bquat: new Float64Array(nb * 4),
                joints: [], q0: model.qpos0, quats: [] };
  model.bodies.forEach((b, i) => {
    kin.parent[i] = b.parent;
    kin.bpos.set(b.pos, i * 3);
    kin.bquat.set(b.quat, i * 4);
    kin.joints.push(b.joints);
    for (const j of b.joints) {
      if (j.type === 'ball') kin.quats.push(j.adr);
      if (j.type === 'free') kin.quats.push(j.adr + 3);
    }
  });
  return kin;
}

let RX = 0, RY = 0, RZ = 0;                 // result of rot()
let QW = 1, QX = 0, QY = 0, QZ = 0;         // result of mul()
function rot(w, x, y, z, vx, vy, vz) {      // rotate v by the unit quaternion (w, x, y, z)
  const tx = 2 * (y * vz - z * vy), ty = 2 * (z * vx - x * vz), tz = 2 * (x * vy - y * vx);
  RX = vx + w * tx + (y * tz - z * ty);
  RY = vy + w * ty + (z * tx - x * tz);
  RZ = vz + w * tz + (x * ty - y * tx);
}
function mul(aw, ax, ay, az, bw, bx, by, bz) {
  QW = aw * bw - ax * bx - ay * by - az * bz;
  QX = aw * bx + ax * bw + ay * bz - az * by;
  QY = aw * by - ax * bz + ay * bw + az * bx;
  QZ = aw * bz + ax * by - ay * bx + az * bw;
}

// World position xpos[3b..] and orientation xquat[4b..] (w, x, y, z) of every body at the
// joint coordinates q[o..o+nq).  A body starts from its parent's frame moved by its fixed
// offset; then each of its joints acts in turn (a rotation keeps the joint's anchor in place).
function fk(kin, q, o, xpos, xquat) {
  const q0 = kin.q0;
  for (let i = 0; i < kin.nb; i++) {
    const p = kin.parent[i];
    let x = 0, y = 0, z = 0, w = 1, a = 0, b = 0, c = 0;
    if (p >= 0) {
      const pw = xquat[p * 4], px = xquat[p * 4 + 1], py = xquat[p * 4 + 2], pz = xquat[p * 4 + 3];
      rot(pw, px, py, pz, kin.bpos[i * 3], kin.bpos[i * 3 + 1], kin.bpos[i * 3 + 2]);
      x = xpos[p * 3] + RX; y = xpos[p * 3 + 1] + RY; z = xpos[p * 3 + 2] + RZ;
      mul(pw, px, py, pz, kin.bquat[i * 4], kin.bquat[i * 4 + 1], kin.bquat[i * 4 + 2], kin.bquat[i * 4 + 3]);
      w = QW; a = QX; b = QY; c = QZ;
    } else {
      x = kin.bpos[i * 3]; y = kin.bpos[i * 3 + 1]; z = kin.bpos[i * 3 + 2];
      w = kin.bquat[i * 4]; a = kin.bquat[i * 4 + 1]; b = kin.bquat[i * 4 + 2]; c = kin.bquat[i * 4 + 3];
    }
    for (const j of kin.joints[i]) {
      const d = o + j.adr;
      if (j.type === 'free') {
        x = q[d]; y = q[d + 1]; z = q[d + 2];
        const s = 1 / Math.hypot(q[d + 3], q[d + 4], q[d + 5], q[d + 6]);
        w = q[d + 3] * s; a = q[d + 4] * s; b = q[d + 5] * s; c = q[d + 6] * s;
      } else if (j.type === 'slide') {
        rot(w, a, b, c, j.axis[0], j.axis[1], j.axis[2]);
        const s = q[d] - q0[j.adr];
        x += RX * s; y += RY * s; z += RZ * s;
      } else {
        rot(w, a, b, c, j.pos[0], j.pos[1], j.pos[2]);
        const ax = x + RX, ay = y + RY, az = z + RZ;              // the joint's anchor
        if (j.type === 'ball') {
          const s = 1 / Math.hypot(q[d], q[d + 1], q[d + 2], q[d + 3]);
          mul(w, a, b, c, q[d] * s, q[d + 1] * s, q[d + 2] * s, q[d + 3] * s);
        } else {                                                  // hinge
          const h = 0.5 * (q[d] - q0[j.adr]), s = Math.sin(h);
          mul(w, a, b, c, Math.cos(h), s * j.axis[0], s * j.axis[1], s * j.axis[2]);
        }
        w = QW; a = QX; b = QY; c = QZ;
        rot(w, a, b, c, j.pos[0], j.pos[1], j.pos[2]);
        x = ax - RX; y = ay - RY; z = az - RZ;
      }
    }
    xpos[i * 3] = x; xpos[i * 3 + 1] = y; xpos[i * 3 + 2] = z;
    xquat[i * 4] = w; xquat[i * 4 + 1] = a; xquat[i * 4 + 2] = b; xquat[i * 4 + 3] = c;
  }
}

// World position of the point `local` of body b (-1: the world) → out[0..2].
function pointOn(b, local, xpos, xquat, out) {
  if (b < 0) { out[0] = local[0]; out[1] = local[1]; out[2] = local[2]; return; }
  rot(xquat[b * 4], xquat[b * 4 + 1], xquat[b * 4 + 2], xquat[b * 4 + 3], local[0], local[1], local[2]);
  out[0] = xpos[b * 3] + RX; out[1] = xpos[b * 3 + 1] + RY; out[2] = xpos[b * 3 + 2] + RZ;
}

// Unit quaternions at the qpos addresses `quats`, with no sign flip from one frame to the
// next: q and -q are the same rotation, but two frames blend the short way only if their
// quaternions are on the same side.
function alignQuats(q, nq, quats) {
  const T = q.length / nq;
  for (const a of quats) {
    for (let k = 0; k < T; k++) {
      const o = k * nq + a;
      let s = 1 / Math.hypot(q[o], q[o + 1], q[o + 2], q[o + 3]);
      if (k && q[o] * q[o - nq] + q[o + 1] * q[o - nq + 1] + q[o + 2] * q[o - nq + 2] + q[o + 3] * q[o - nq + 3] < 0) s = -s;
      q[o] *= s; q[o + 1] *= s; q[o + 2] *= s; q[o + 3] *= s;
    }
  }
}

// three.js builds capsules and cylinders along y; MuJoCo's run along their own z.  This
// quarter turn about x (w, x, y, z) takes the one to the other: the meshes are turned by it,
// and shapeEnds() below, which the tests hold against MuJoCo, goes through it too.
const Y_TO_Z = [Math.SQRT1_2, Math.SQRT1_2, 0, 0];

// World ends of a shape's axis → a[0..2], b[0..2] (both its centre for a shape without one):
// half-length size[1] either way along the axis of a capsule or cylinder.
function shapeEnds(s, xpos, xquat, a, b) {
  const half = s.type === 'capsule' || s.type === 'cylinder' ? s.size[1] : 0;
  rot(Y_TO_Z[0], Y_TO_Z[1], Y_TO_Z[2], Y_TO_Z[3], 0, half, 0);
  rot(s.quat[0], s.quat[1], s.quat[2], s.quat[3], RX, RY, RZ);
  const ex = RX, ey = RY, ez = RZ;
  pointOn(s.body, [s.pos[0] - ex, s.pos[1] - ey, s.pos[2] - ez], xpos, xquat, a);
  pointOn(s.body, [s.pos[0] + ex, s.pos[1] + ey, s.pos[2] + ez], xpos, xquat, b);
}
// ── end of the block the tests run ────────────────────────────────────────

// ── Loading a run ─────────────────────────────────────────────────────────
function showStatus(msg) {
  $('status').textContent = msg;
  $('status').classList.toggle('hidden', !msg);
}

// A run's joint coordinates, series, trail and extent, unpacked once (on first use).
function decode(run) {
  return run.ready ??= (async () => {
    const m = run.m, rec = run.raw.qpos, nq = rec.n, T = rec.frames;
    showStatus(`Decoding ${m.label}…`);
    await new Promise(r => setTimeout(r, 30));

    const q = run.q = unpackFrames(await inflate(rec.data), rec);

    const kin = run.kin = compile(run.model);
    alignQuats(q, nq, kin.quats);

    run.times = m.times ? Float64Array.from(m.times) : Float64Array.from({ length: T }, (_, k) => m.t0 + k * m.dt);
    if (run.raw.series) {
      const f = new Float32Array((await inflate(run.raw.series.data)).buffer);
      run.raw.series.keys.forEach((key, i) => { run.series[key] = f.subarray(i * T, (i + 1) * T); });
    }

    // the path of the trail site, frame by frame
    const site = PAGE.trail && run.model.sites.find(s => s.name === PAGE.trail.site);
    if (site) {
      const xpos = new Float64Array(kin.nb * 3), xquat = new Float64Array(kin.nb * 4);
      const trail = run.trail = new Float32Array(T * 3), p = [0, 0, 0];
      for (let k = 0; k < T; k++) {
        fk(kin, q, k * nq, xpos, xquat);
        pointOn(site.body, site.pos, xpos, xquat, p);
        trail.set(p, k * 3);
      }
      run.trailSite = site;
    }

    // where the shapes are over the run, for fitting a view: centre and bounding radius of
    // every shape at a sample of frames (x, y, z, r each)
    {
      const shapes = [...run.model.geoms, ...run.model.sites];
      const radius = s => (s.type === 'capsule' ? s.size[0] + s.size[1] : s.type === 'cylinder' ? Math.hypot(s.size[0], s.size[1])
                         : s.type === 'ellipsoid' ? Math.max(...s.size) : s.type === 'box' ? Math.hypot(...s.size) : s.size[0]);
      const xpos = new Float64Array(kin.nb * 3), xquat = new Float64Array(kin.nb * 4), p = [0, 0, 0];
      const n = Math.min(T, 64), cloud = run.cloud = new Float32Array(n * shapes.length * 4);
      let o = 0;
      for (let i = 0; i < n; i++) {
        fk(kin, q, Math.round(i * (T - 1) / (n - 1)) * nq, xpos, xquat);
        for (const s of shapes) {
          pointOn(s.body, s.pos, xpos, xquat, p);
          cloud[o++] = p[0]; cloud[o++] = p[1]; cloud[o++] = p[2]; cloud[o++] = radius(s);
        }
      }
    }
    run.raw = null;
    showStatus('');
  })();
}

// ── Shapes ────────────────────────────────────────────────────────────────
// MuJoCo geom → mesh in its body's frame.  Capsules and cylinders run along the local z axis.
const yToZ = new THREE.Quaternion(Y_TO_Z[1], Y_TO_Z[2], Y_TO_Z[3], Y_TO_Z[0]);
function shapeMesh(s) {
  const [a, b, c] = s.size;
  let geo;
  if (s.type === 'sphere')         geo = new THREE.SphereGeometry(a, 32, 20);
  else if (s.type === 'capsule')   geo = new THREE.CapsuleGeometry(a, 2 * b, 12, 32).applyQuaternion(yToZ);
  else if (s.type === 'cylinder')  geo = new THREE.CylinderGeometry(a, a, 2 * b, 32).applyQuaternion(yToZ);
  else if (s.type === 'ellipsoid') geo = new THREE.SphereGeometry(1, 32, 20).scale(a, b, c);
  else                             geo = new THREE.BoxGeometry(2 * a, 2 * b, 2 * c);
  const alpha = s.rgba[3];
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.0, transparent: alpha < 1, opacity: alpha,
                                               depthWrite: alpha >= 0.9 });
  mat.color.setRGB(s.rgba[0], s.rgba[1], s.rgba[2], THREE.SRGBColorSpace);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.fromArray(s.pos);
  mesh.quaternion.set(s.quat[1], s.quat[2], s.quat[3], s.quat[0]);
  mesh.castShadow = alpha >= 0.9;
  mesh.receiveShadow = alpha >= 0.9;
  return mesh;
}

// ── Pane: one 3D view of one run ──────────────────────────────────────────
class Pane {
  constructor(index) {
    this.index = index;
    this.run   = null;
    this.model = null;        // the model whose meshes are in the scene
    this.sel   = new Set();   // picked links (indices into this.chain)
    this.k     = 0;           // frame index at/before the current time
    this.near  = 0;           // recorded frame nearest to the current time
    this.chain = [];          // rod links: { mesh, shape, base, r }
    this.shapes = [];         // every drawn shape: { mesh, shape }

    const scene = this.scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8794, 1.5));

    const sun = this.sun = new THREE.DirectionalLight(0xffffff, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.bias = -0.0003;
    scene.add(sun, sun.target);

    const fill = new THREE.DirectionalLight(0xc8d8ff, 0.8);
    fill.position.set(3, 3, 1.5);
    scene.add(fill);

    // floor: a plate that takes the shadows, and a grid on it
    this.plate = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.95 }));
    this.plate.receiveShadow = true;
    this.grid = null;
    this.ground = new THREE.Group();
    this.ground.add(this.plate);
    this.ground.visible = false;            // until a run sizes it
    scene.add(this.ground);

    this.world = new THREE.Group();         // bodies, static shapes, trail
    scene.add(this.world);

    // header: series key + run selector, a line of facts, the phase now, and a note
    const head = this.head = document.createElement('div');
    head.className = 'head panel';
    const row = document.createElement('div');
    row.className = 'row';
    const key = document.createElement('span');
    key.className = 'key';
    key.style.background = `var(--series-${index + 1})`;
    const select = this.select = document.createElement('select');
    RUNS.forEach((run, i) => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = run.m.label;
      select.appendChild(option);
    });
    select.title = index ? 'Run shown in this view' : 'Run shown in this view (keys 1–9)';
    select.setAttribute('aria-label', 'Run');
    select.addEventListener('change', () => chooseRun(this, RUNS[+select.value]));
    this.info = document.createElement('div');
    this.info.className = 'hint';
    this.phase = document.createElement('div');
    this.phase.className = 'phase';
    const about = this.about = document.createElement('details');
    about.className = 'about panel';
    about.open = window.innerWidth >= 720;       // on a small screen the view comes first
    const summary = document.createElement('summary');
    summary.textContent = 'About this run';
    this.note = document.createElement('div');
    this.note.className = 'hint';
    about.append(summary, this.note);
    about.addEventListener('toggle', layout);
    row.append(key, select);
    head.append(row, this.info, this.phase);
    $('heads').append(head, about);

    this.applyTheme();
  }

  applyTheme() {
    this.scene.background = new THREE.Color(theme.bg);
    this.plate.material.color.set(theme.plate);
    this.buildGrid();
    if (this.trail) this.trail.userData.stamp = -1;
  }

  buildGrid() {
    if (this.grid) { this.ground.remove(this.grid); this.grid.geometry.dispose(); this.grid.material.dispose(); this.grid = null; }
    const f = this.run && this.run.m.floor;
    if (!f) return;
    const grid = this.grid = new THREE.GridHelper(f.size, Math.round(f.size / f.cell), theme.edge, theme.line);
    grid.rotation.x = Math.PI / 2;                      // GridHelper lies in xz; the floor is xy
    grid.position.set(f.center[0], f.center[1], f.z + 0.0005 * f.size);
    this.ground.add(grid);
  }

  // Meshes of one model: a group per body, its shapes inside; world shapes directly.
  buildModel(model) {
    this.removeModel();
    this.model = model;
    const kin = this.kin = compile(model);
    this.xpos  = new Float64Array(kin.nb * 3);
    this.xquat = new Float64Array(kin.nb * 4);
    this.posA  = new Float64Array(kin.nb * 3); this.quatA = new Float64Array(kin.nb * 4);
    this.posB  = new Float64Array(kin.nb * 3); this.quatB = new Float64Array(kin.nb * 4);
    this.q     = new Float32Array(model.nq);
    this.bodies = model.bodies.map(() => new THREE.Group());
    this.bodies.forEach(g => this.world.add(g));
    this.sites = {};
    const add = (s, isSite) => {
      const mesh = shapeMesh(s);
      (s.body < 0 ? this.world : this.bodies[s.body]).add(mesh);
      const entry = { mesh, shape: s, base: mesh.material.color.clone(), r: s.size[0] };
      this.shapes.push(entry);
      if (s.chain) { entry.index = this.chain.length; this.chain.push(entry); }
      if (isSite) { this.sites[s.name] = entry; mesh.castShadow = false; }
    };
    model.geoms.forEach(s => add(s, false));
    model.sites.forEach(s => add(s, true));
    this.speed = new Float32Array(this.chain.length);

    if (PAGE.trail) {
      const geo = new LineSegmentsGeometry();
      geo.setPositions(new Float32Array(TRAIL_MAX * 6));
      geo.setColors(new Float32Array(TRAIL_MAX * 6));
      const mat = new LineMaterial({ linewidth: 2.5, vertexColors: true });
      const trail = this.trail = new LineSegments2(geo, mat);
      trail.frustumCulled = false;
      trail.userData.stamp = -1;
      this.world.add(trail);
    }
    this.applyToggles();
  }

  removeModel() {
    for (const { mesh } of this.shapes) { mesh.geometry.dispose(); mesh.material.dispose(); }
    if (this.trail) { this.trail.geometry.dispose(); this.trail.material.dispose(); }
    this.world.clear();
    this.shapes = [];
    this.chain = [];
    this.trail = null;
    this.model = null;
  }

  // Shapes that belong to a page toggle are drawn only while it has their value.
  applyToggles() {
    for (const { mesh, shape } of this.shapes)
      mesh.visible = !shape.when || state.toggles[shape.when[0]] === shape.when[1];
  }

  async setRun(run) {
    this.pending = run;
    await decode(run);
    if (this.pending !== run || !panes.includes(this)) return;     // a later selection won, or the pane is gone

    if (this.model !== run.model) this.buildModel(run.model);
    this.run = run;
    this.sel.clear();
    this.select.value = RUNS.indexOf(run);
    const m = run.m;
    this.info.textContent = m.info || '';
    this.info.title = m.source || '';          // which archive this is
    this.note.textContent = m.note || '';
    this.about.style.display = m.note ? '' : 'none';

    // light and shadows sized to the run's extent
    const lo = new THREE.Vector3(...m.bounds.lo), hi = new THREE.Vector3(...m.bounds.hi);
    const centre = lo.clone().add(hi).multiplyScalar(0.5), R = Math.max(lo.distanceTo(hi) / 2, 1e-6);
    const reach = m.floor ? Math.max(R, centre.z - m.floor.z + 0.2 * R) : R;
    this.sun.target.position.copy(centre);
    this.sun.position.copy(centre).add(new THREE.Vector3(-1.5, -2.0, 5.0).normalize().multiplyScalar(4 * reach));
    Object.assign(this.sun.shadow.camera, { left: -1.6 * reach, right: 1.6 * reach, bottom: -1.6 * reach, top: 1.6 * reach,
                                            near: 0.5 * reach, far: 9 * reach });
    this.sun.shadow.camera.updateProjectionMatrix();
    this.sun.shadow.normalBias = 0.004 * reach;
    if (m.floor) {
      const f = m.floor, th = 0.02 * f.size;
      this.plate.position.set(f.center[0], f.center[1], f.z - th / 2);
      this.plate.scale.set(f.size, f.size, th);
    }
    this.buildGrid();
    onRunsChanged();
  }

  // Move every body to the global time.
  update() {
    const run = this.run;
    if (!run) return;
    const m = run.m, q = run.q, times = run.times, T = times.length, nq = run.model.nq;

    // frame k and blend a so that time = times[k] + a * (times[k+1] - times[k])
    const t = Math.min(Math.max(state.time, times[0]), times[T - 1]);
    const early = state.time < times[0] - 1e-9, late = state.time > times[T - 1] + 1e-9;
    const k = frameAt(times, t);
    const a = (t - times[k]) / (times[k + 1] - times[k]);
    this.k = k;
    this.near = a < 0.5 ? k : k + 1;
    this.t = t;

    const qi = this.q, o0 = k * nq, o1 = o0 + nq;
    for (let i = 0; i < nq; i++) qi[i] = q[o0 + i] + (q[o1 + i] - q[o0 + i]) * a;
    fk(this.kin, qi, 0, this.xpos, this.xquat);
    const xpos = this.xpos, xquat = this.xquat;
    this.bodies.forEach((g, b) => {
      g.position.set(xpos[b * 3], xpos[b * 3 + 1], xpos[b * 3 + 2]);
      g.quaternion.set(xquat[b * 4 + 1], xquat[b * 4 + 2], xquat[b * 4 + 3], xquat[b * 4]);
    });

    if (state.color === 'speed' || this.sel.size) this.measureSpeed();
    this.updateColors();
    this.updateTrail();
    this.updateHit();
    const ph = (m.phases || []).find(p => t >= p.t0 && t < p.t1) || (m.phases || []).at(-1);
    this.phase.textContent = early ? `this run starts at ${times[0].toFixed(3)} s`
                           : late ? `this run ended at ${times[T - 1].toFixed(3)} s` : ph ? ph.label : '';
    this.phase.style.display = m.phases || early || late ? '' : 'none';

    this.ground.visible = state.floor && !!m.floor;
    this.sun.castShadow = state.shadows;
  }

  // Speed of every rod link [m/s]: its centre between the two recorded frames around now.
  measureSpeed() {
    const run = this.run, nq = run.model.nq, times = run.times, k = this.k;
    fk(this.kin, run.q, k * nq, this.posA, this.quatA);
    fk(this.kin, run.q, (k + 1) * nq, this.posB, this.quatB);
    const dt = times[k + 1] - times[k], pa = [0, 0, 0], pb = [0, 0, 0];
    this.chain.forEach((c, i) => {
      pointOn(c.shape.body, c.shape.pos, this.posA, this.quatA, pa);
      pointOn(c.shape.body, c.shape.pos, this.posB, this.quatB, pb);
      this.speed[i] = Math.hypot(pb[0] - pa[0], pb[1] - pa[1], pb[2] - pa[2]) / dt;
    });
  }

  // Bend of the ball joint that carries a rod link [deg]: the angle between the two tangents.
  bendOf(c) {
    const a = c.shape.bend;
    if (a === undefined) return 0;
    const q = this.q, n2 = q[a] * q[a] + q[a + 1] * q[a + 1] + q[a + 2] * q[a + 2] + q[a + 3] * q[a + 3];
    const s = (q[a + 2] * q[a + 2] + q[a + 3] * q[a + 3]) / n2;          // sin^2(bend / 2), tangent = local x
    return 2 * Math.asin(Math.sqrt(Math.min(1, s))) * 180 / Math.PI;
  }

  updateColors() {
    const mode = state.color, top = colorScale(mode), tracking = this.sel.size > 0;
    for (const c of this.chain) {
      let col = c.base;
      if (mode !== 'model') {
        const v = mode === 'speed' ? this.speed[c.index] : this.bendOf(c);
        const i = Math.min(255, Math.max(0, Math.round(255 * v / top))) * 3;
        col = tmpC.setRGB(lut[i], lut[i + 1], lut[i + 2]);
      }
      const target = c.mesh.material.color;
      if (tracking && this.sel.has(c.index)) target.copy(pickLin);
      else if (tracking) target.copy(dimLin).lerp(col, 0.35);
      else target.copy(col);
    }
  }

  // The trail site's path over the last PAGE.trail.window seconds, fading into the background.
  updateTrail() {
    const line = this.trail, run = this.run;
    if (!line) return;
    const on = !!run.trail && state.toggles.trail !== false;
    line.visible = on;
    if (!on) return;
    const times = run.times, tr = run.trail, t = this.t, win = PAGE.trail.window;
    let i0 = this.k;
    while (i0 > 0 && times[i0 - 1] > t - win && this.k - i0 < TRAIL_MAX - 2) i0--;
    const n = this.k - i0 + 1;                              // recorded points, then the point now
    const pos = line.geometry.attributes.instanceStart.data.array;
    const col = line.geometry.attributes.instanceColorStart.data.array;
    const now = [0, 0, 0];
    pointOn(run.trailSite.body, run.trailSite.pos, this.xpos, this.xquat, now);
    const shade = j => {                                    // 0 at the oldest point, 1 now
      const f = Math.pow(Math.min(1, Math.max(0, 1 - (t - (j < n ? times[i0 + j] : t)) / win)), 1.5);
      return tmpC.copy(bgLin).lerp(trailLin, f);
    };
    for (let j = 0; j < n; j++) {
      const o = j * 6, a = (i0 + j) * 3, last = j === n - 1;
      pos[o] = tr[a]; pos[o + 1] = tr[a + 1]; pos[o + 2] = tr[a + 2];
      pos[o + 3] = last ? now[0] : tr[a + 3]; pos[o + 4] = last ? now[1] : tr[a + 4]; pos[o + 5] = last ? now[2] : tr[a + 5];
      let c = shade(j);          col[o] = c.r;     col[o + 1] = c.g; col[o + 2] = c.b;
      c = shade(j + 1);          col[o + 3] = c.r; col[o + 4] = c.g; col[o + 5] = c.b;
    }
    line.geometry.instanceCount = n;
    line.geometry.attributes.instanceStart.data.needsUpdate = true;
    line.geometry.attributes.instanceColorStart.data.needsUpdate = true;
  }

  // The target lights up for a moment after each recorded pass of the tip.
  updateHit() {
    const cfg = PAGE.hit, entry = cfg && this.sites[cfg.site];
    if (!entry) return;
    const hit = (this.run.m.hits || []).findLast(h => h.t <= this.t);
    const on = !!hit && this.t - hit.t < cfg.hold && hit.miss <= cfg.within;
    entry.mesh.material.color.copy(on ? hitLin : entry.base);
    entry.mesh.material.opacity = on ? 1 : entry.shape.rgba[3];
    entry.mesh.scale.setScalar(on ? 1.5 : 1);
  }

  // Thickness of the rod links. This depends on the camera too: thin links are widened just
  // enough to stay MIN_WIDTH_PX wide on screen (pxAngle = world size of a pixel at unit depth).
  place(pxAngle) {
    if (!this.chain.length) return;
    const cam = camera.position, f = camera.getWorldDirection(forward);
    const minR = MIN_WIDTH_PX / 2 * pxAngle;
    for (const c of this.chain) {
      const b = c.shape.body, p = c.shape.pos;
      let x = p[0], y = p[1], z = p[2];
      if (b >= 0) {
        rot(this.xquat[b * 4], this.xquat[b * 4 + 1], this.xquat[b * 4 + 2], this.xquat[b * 4 + 3], x, y, z);
        x = this.xpos[b * 3] + RX; y = this.xpos[b * 3 + 1] + RY; z = this.xpos[b * 3 + 2] + RZ;
      }
      const depth = (x - cam.x) * f.x + (y - cam.y) * f.y + (z - cam.z) * f.z;
      const s = Math.max(state.thickness, minR * depth / c.r);
      if (c.shape.type === 'capsule' || c.shape.type === 'cylinder') c.mesh.scale.set(s, s, 1);
      else c.mesh.scale.setScalar(s);
    }
  }

  // Rod link under a ray: the frontmost one actually hit, else the one closest to the ray
  // within `tol` px.  Other shapes: an ordinary ray cast (for the orbit centre).
  pick(ray, pxAngle, tol = 6) {
    const o = ray.origin, d = ray.direction;
    let hit = null, near = null;
    const pa = [0, 0, 0], pb = [0, 0, 0];
    for (const c of this.chain) {
      if (!c.mesh.visible) continue;
      shapeEnds(c.shape, this.xpos, this.xquat, pa, pb);       // the link's axis
      const r = c.r * c.mesh.scale.x;
      const ex = pb[0] - pa[0], ey = pb[1] - pa[1], ez = pb[2] - pa[2];
      const wx = o.x - pa[0], wy = o.y - pa[1], wz = o.z - pa[2];
      const B = d.x * ex + d.y * ey + d.z * ez, C = ex * ex + ey * ey + ez * ez;
      const D = d.x * wx + d.y * wy + d.z * wz, E = ex * wx + ey * wy + ez * wz;
      const den = C - B * B;
      const u = den > 1e-12 ? Math.min(1, Math.max(0, (E - B * D) / den)) : 0;     // along the link
      const t = B * u - D;                                                           // along the ray
      if (t <= 0) continue;
      const dist = Math.hypot(wx + t * d.x - u * ex, wy + t * d.y - u * ey, wz + t * d.z - u * ez);
      if (dist <= r) {
        if (!hit || t < hit.t) hit = { link: c.index, t };
      } else {
        const px = (dist - r) / (pxAngle * t);
        if (px < tol && (!near || px < near.px)) near = { link: c.index, t, px };
      }
    }
    const best = hit || near;
    if (best) return { link: best.link, point: ray.at(best.t, new THREE.Vector3()) };
    raycaster.ray.copy(ray);
    const other = raycaster.intersectObjects(this.shapes.filter(e => e.mesh.visible && !e.shape.chain).map(e => e.mesh), false)[0];
    return other ? { link: null, point: other.point.clone() } : null;
  }

  dispose() {
    this.head.remove();
    this.about.remove();
    this.removeModel();
    if (this.grid) { this.grid.geometry.dispose(); this.grid.material.dispose(); }
    this.plate.geometry.dispose();
    this.plate.material.dispose();
    this.sun.shadow.dispose();
  }
}

// Upper end of the colour scale, shared by the panes so their colours compare.
function colorScale(mode) {
  let top = 0;
  for (const p of panes) if (p.run && p.run.m.scales && p.run.m.scales[mode]) top = Math.max(top, p.run.m.scales[mode]);
  return top || 1;
}

// ── Layout & rendering ────────────────────────────────────────────────────
// CSS-pixel rectangle of a pane, above the bottom controls.
function paneRect(i) {
  const w = window.innerWidth / panes.length;
  return { x: i * w, y: 0, w, h: window.innerHeight - $('controls').offsetHeight };
}

function layout() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  panes.forEach((p, i) => {
    const rect = paneRect(i);
    p.head.style.left = p.about.style.left = `${rect.x + 14}px`;
    p.head.style.maxWidth  = `${Math.max(160, Math.min(380, rect.w - 28))}px`;
    p.about.style.maxWidth = `${Math.max(160, Math.min(560, rect.w - 28))}px`;
    p.about.style.bottom   = `${window.innerHeight - rect.h + 14}px`;
  });
  // in a narrow window a pane's header reaches the settings panel: move the panel below it
  const settings = $('settings'), last = panes.at(-1);
  const head = last && last.head.getBoundingClientRect();
  settings.style.top = '';
  if (head && head.right > settings.getBoundingClientRect().left - 8) settings.style.top = `${head.bottom + 8}px`;
  $('divider').style.display = panes.length > 1 ? 'block' : 'none';
  $('divider').style.height  = `${paneRect(0).h}px`;
  const paneH = paneRect(0).h;
  topInset = Math.min(Math.max(0, ...panes.map(p => p.head.getBoundingClientRect().bottom)) + 6, 0.4 * paneH);
  bottomInset = Math.min(Math.max(0, ...panes.map(p => (p.about.style.display === 'none' ? 0 : p.about.offsetHeight + 20))), 0.3 * paneH);
  sideInset = panes.length === 1 && settings.open && window.innerWidth >= 900 ? settings.offsetWidth + 22 : 0;
  dirty = true;
}

// Projection for one pane: its aspect, and the image centred in what the panels leave free.
function frame(rect) {
  camera.aspect = rect.w / rect.h;
  camera.setViewOffset(rect.w, rect.h, sideInset / 2, (bottomInset - topInset) / 2, rect.w, rect.h);     // also updates the projection
}

function render() {
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.setScissorTest(true);
  camera.updateMatrixWorld();
  panes.forEach((p, i) => {
    const rect = paneRect(i), bottom = window.innerHeight - rect.h;
    renderer.setViewport(rect.x, bottom, rect.w, rect.h);
    renderer.setScissor(rect.x, bottom, rect.w, rect.h);
    frame(rect);
    if (p.run) p.place(2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / rect.h);
    renderer.render(p.scene, camera);
  });
  drawChart();
}

function refresh() {
  panes.forEach(p => p.update());
  updateTimeUI();
  dirty = true;
}

// ── Camera views ──────────────────────────────────────────────────────────
// Look at the first pane's whole motion along `back` (from the scene to the camera), just far
// enough to fit it in what the panels leave free of a pane (every shape, at a sample of
// frames, inside the view with a margin).
function fitView(back, zoom = 1) {
  const run = panes[0] && panes[0].run;
  if (!run) return;
  const rect = paneRect(0);
  const lo = new THREE.Vector3(...run.m.bounds.lo), hi = new THREE.Vector3(...run.m.bounds.hi);
  const target = lo.clone().add(hi).multiplyScalar(0.5);
  const R = Math.max(lo.distanceTo(hi) / 2, 1e-6);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const tanH = tanV * (rect.w - sideInset) / rect.h;                 // half of what the panels leave free,
  const tanFree = tanV * (rect.h - topInset - bottomInset) / rect.h; // across and down
  const right = new THREE.Vector3().crossVectors(camera.up, back);
  if (right.lengthSq() < 1e-10) right.set(1, 0, 0);                  // looking straight down or up
  right.normalize();
  const up    = new THREE.Vector3().crossVectors(back, right);
  let dist = 0;
  const cloud = run.cloud;
  for (let o = 0; o < cloud.length; o += 4) {
    tmpV.set(cloud[o], cloud[o + 1], cloud[o + 2]).sub(target);
    const depth = tmpV.dot(back), r = cloud[o + 3];
    dist = Math.max(dist, depth + (Math.abs(tmpV.dot(right)) + r) / tanH, depth + (Math.abs(tmpV.dot(up)) + r) / tanFree);
  }
  dist *= 1.12 * zoom;
  camera.near = R / 100;
  camera.far  = R * 200;
  controls.minDistance = R / 25;
  controls.maxDistance = R * 40;
  controls.target.copy(target);
  camera.position.copy(target).addScaledVector(back, dist);
  controls.update();
  dirty = true;
  saveHash();
}

// A named view of the page.
function setView(id) {
  const view = VIEWS.find(v => v.id === id) || VIEWS[0];
  fitView(new THREE.Vector3(...view.dir).normalize(), view.zoom || 1);
}

// The same viewing direction, centred and fitted again (the pane changed size, or its run).
function refit() {
  const back = camera.position.clone().sub(controls.target);
  if (back.lengthSq() > 0) fitView(back.normalize());
}

// Do two runs' boxes differ by more than a fifth of the larger one?
function boxesDiffer(a, b) {
  let size = 0, gap = 0;
  for (let i = 0; i < 3; i++) {
    size = Math.max(size, a.hi[i] - a.lo[i], b.hi[i] - b.lo[i]);
    gap  = Math.max(gap, Math.abs(a.lo[i] - b.lo[i]), Math.abs(a.hi[i] - b.hi[i]));
  }
  return gap > 0.2 * size;
}

// ── Time ──────────────────────────────────────────────────────────────────
// The clock runs over the first pane's run.  A second pane follows it, and waits at its own
// first or last frame while the clock is outside its run.
function timeRange() {
  const run = panes[0] && panes[0].run;
  return run ? [run.times[0], run.times.at(-1)] : [0, 1];
}

function setTime(t) {
  const [lo, hi] = timeRange();
  state.time = Math.min(Math.max(t, lo), hi);
  refresh();
}

function setPlaying(on) {
  state.playing = on;
  $('btn-play').textContent = on ? '⏸' : '▶';
  if (!on) saveHash();
}

// Step whole recorded frames of the first pane's run.
function stepFrames(n) {
  const p = panes[0];
  if (!p.run) return;
  setPlaying(false);
  const times = p.run.times;
  setTime(times[Math.min(Math.max(p.near + n, 0), times.length - 1)]);
  saveHash();
}

function updateTimeUI() {
  const [lo, hi] = timeRange();
  $('scrubber').value = Math.round((state.time - lo) / (hi - lo) * 10000);
  $('time-label').textContent = `t = ${state.time.toFixed(3)} s`;
  const p = panes[0];
  if (p && p.run) $('frame-label').textContent = `frame ${p.near} / ${p.run.times.length - 1}`;
  updatePickInfo();
}

// Index of the last recorded frame at or before t, at most the one before the last
// (frames need not be evenly spaced).
function frameAt(times, t) {
  let lo = 0, hi = times.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (times[mid] <= t) lo = mid; else hi = mid;
  }
  return lo;
}

// ── Metric plot above the scrubber ────────────────────────────────────────
const PLOT = { left: 44, right: 14, top: 7, bottom: 5 };

// A run's plotted quantity at a time; NaN where the run has none (no such series, or the
// time is outside the run).
function metricAt(run, key, time) {
  const v = run.series[key], times = run.times;
  if (!v || time < times[0] - 1e-9 || time > times.at(-1) + 1e-9) return NaN;
  const t = Math.min(Math.max(time, times[0]), times.at(-1)), k = frameAt(times, t);
  return v[k] + (v[k + 1] - v[k]) * (t - times[k]) / (times[k + 1] - times[k]);
}

function niceCeil(v) {
  if (!(v > 0)) return 1;
  const p = 10 ** Math.floor(Math.log10(v)), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

// Vertical scale of the plotted quantity over the shown runs, within the clock's span: from 0
// (or below, if it goes negative) to a round number above it; whole decades for a quantity
// marked `log`.  at(v) is the height of a value, 0 at the bottom of the plot and 1 at its top.
function metricScale(key) {
  const d = METRICS[key], [t0, t1] = timeRange();
  let lo = Infinity, hi = -Infinity;
  for (const p of panes) {
    const v = p.run && p.run.series[key];
    if (!v) continue;
    const times = p.run.times;
    for (let k = 0; k < v.length; k++) {
      if (times[k] < t0 - 1e-9 || times[k] > t1 + 1e-9) continue;
      if (v[k] < lo) lo = v[k];
      if (v[k] > hi) hi = v[k];
    }
  }
  if (!(lo <= hi)) { lo = 0; hi = 0; }
  if (d.log) {
    const floor = d.floor || 1e-9;
    const b = Math.floor(Math.log10(Math.max(lo, floor)) + 1e-9);
    const top = Math.max(Math.ceil(Math.log10(Math.max(hi, floor)) - 1e-9), b + 1);
    return { bottom: 10 ** b, top: 10 ** top, zero: false, at: v => (Math.log10(Math.max(v, 10 ** b)) - b) / (top - b) };
  }
  // zero for what the readout shows as zero (rounding noise), and for a dip below zero too
  // small to draw (a fiftieth of the range): the axis then starts at 0
  const eps = Math.max(0.5 * 10 ** -(d.digits ?? 2), 0.02 * hi);
  const bottom = lo < -eps ? -niceCeil(-lo) : 0;
  const top = d.max || (hi > 0.5 * 10 ** -(d.digits ?? 2) ? niceCeil(hi) : (bottom < 0 ? 0 : 1));
  return { bottom, top, zero: bottom < 0 && top > 0, at: v => (v - bottom) / (top - bottom) };
}

// A value of the plotted quantity as an axis label.
function axisLabel(key, v) {
  if (!METRICS[key].adaptive) return String(+v.toPrecision(3));
  const a = Math.abs(v);
  return a === 0 ? '0' : a < 1e-4 ? `${+(1e6 * v).toPrecision(3)} µm` : a < 0.1 ? `${+(1e3 * v).toPrecision(3)} mm` : `${+v.toPrecision(3)} m`;
}

function drawChart() {
  const c = $('chart'), dpr = Math.min(window.devicePixelRatio, 2);
  const W = c.clientWidth, H = c.clientHeight;
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
  }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const shown = panes.filter(p => p.run);
  if (!shown.length || !METRICS[state.metric]) return;
  const css = getComputedStyle(document.documentElement);
  const key = state.metric, format = fmt(key);
  const [lo, hi] = timeRange();
  const x0 = PLOT.left, x1 = W - PLOT.right, y0 = H - PLOT.bottom, y1 = PLOT.top;
  const scale = metricScale(key);
  const X = t => x0 + (t - lo) / (hi - lo) * (x1 - x0);
  const Y = v => y0 + scale.at(v) * (y1 - y0);

  // recessive grid: bottom, middle, top; phase boundaries of the first run as ticks
  g.lineWidth = 1;
  g.strokeStyle = theme.grid;
  for (const f of [0, 0.5, 1]) {
    const y = Math.round(y0 + f * (y1 - y0)) + 0.5;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  }
  if (scale.zero) {                                     // the zero line of a signed quantity
    g.strokeStyle = theme.edge;
    const y = Math.round(Y(0)) + 0.5;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.strokeStyle = theme.grid;
  }
  for (const ph of (shown[0].run.m.phases || []).slice(1)) {
    const x = Math.round(X(ph.t0)) + 0.5;
    g.beginPath(); g.moveTo(x, y1); g.lineTo(x, y0); g.stroke();
  }
  g.fillStyle = css.getPropertyValue('--muted');
  g.font = "10px 'SF Mono', 'Fira Code', ui-monospace, monospace";
  g.textAlign = 'right';
  g.textBaseline = 'middle';
  g.fillText(axisLabel(key, scale.top), x0 - 6, y1);
  g.fillText(axisLabel(key, scale.bottom), x0 - 6, y0);

  // one line per pane, over the clock's span only
  g.save();
  g.beginPath();
  g.rect(x0, 0, x1 - x0, H);
  g.clip();
  g.lineWidth = 2;
  g.lineJoin = g.lineCap = 'round';
  for (const p of shown) {
    const v = p.run.series[key], times = p.run.times;
    if (!v) continue;
    g.strokeStyle = theme.series[p.index];
    g.beginPath();
    for (let k = 0; k < v.length; k++) g.lineTo(X(times[k]), Y(v[k]));
    g.stroke();
  }
  g.restore();

  // hover crosshair, then the playhead with a ringed dot on each line
  g.lineWidth = 1;
  if (hoverTime !== null) {
    g.strokeStyle = css.getPropertyValue('--muted');
    const x = Math.round(X(hoverTime)) + 0.5;
    g.beginPath(); g.moveTo(x, y1 - 4); g.lineTo(x, y0); g.stroke();
  }
  g.strokeStyle = css.getPropertyValue('--strong');
  const xNow = X(state.time);
  g.beginPath(); g.moveTo(Math.round(xNow) + 0.5, y1 - 4); g.lineTo(Math.round(xNow) + 0.5, y0); g.stroke();
  for (const p of shown) {
    const value = metricAt(p.run, key, state.time);
    if (!Number.isFinite(value)) continue;
    const y = Y(value);
    g.fillStyle = theme.bg;
    g.beginPath(); g.arc(xNow, y, 6, 0, 2 * Math.PI); g.fill();
    g.fillStyle = theme.series[p.index];
    g.beginPath(); g.arc(xNow, y, 4, 0, 2 * Math.PI); g.fill();
  }

  // readout next to the plot selector: each shown run and its value now
  shown.forEach((p, i) => {
    const value = $('chart-legend').children[i]?.lastChild;
    if (value) value.textContent = format(metricAt(p.run, key, state.time));
  });
}

// A row "── label value" keyed by the pane's series colour.
function keyRow(pane, first, second) {
  const row = document.createElement('span');
  const key = document.createElement('span');
  key.className = 'key';
  key.style.background = `var(--series-${pane.index + 1})`;
  row.append(key, first, second);
  return row;
}

function textSpan(text, strong) {
  const s = document.createElement('span');
  s.textContent = text;
  if (strong) s.className = 'strong';
  return s;
}

function buildChartLegend() {
  $('chart-legend').replaceChildren(
    ...panes.filter(p => p.run).map(p => keyRow(p, textSpan(p.run.m.label), textSpan('', true))));
}

function chartTime(ev) {
  const rect = $('chart').getBoundingClientRect();
  const [lo, hi] = timeRange();
  const f = (ev.clientX - rect.left - PLOT.left) / (rect.width - PLOT.left - PLOT.right);
  return lo + Math.min(Math.max(f, 0), 1) * (hi - lo);
}

function showTip(ev) {
  const run = panes[0].run;
  if (!run || !METRICS[state.metric]) return;
  // snap to the nearest recorded frame
  const times = run.times, t = Math.min(Math.max(chartTime(ev), times[0]), times.at(-1));
  let k = frameAt(times, t);
  if (t - times[k] > times[k + 1] - t) k++;
  hoverTime = times[k];

  const format = fmt(state.metric), tip = $('tip');
  tip.replaceChildren(
    textSpan(`t = ${hoverTime.toFixed(3)} s · ${METRICS[state.metric].label}`),
    ...panes.filter(p => p.run).map(p =>
      keyRow(p, textSpan(format(metricAt(p.run, state.metric, hoverTime)), true), textSpan(p.run.m.label))));
  tip.style.display = 'flex';
  const bar = $('controls').getBoundingClientRect();
  tip.style.left = `${Math.min(Math.max(ev.clientX - bar.left + 12, 8), bar.width - tip.offsetWidth - 8)}px`;
  dirty = true;
}

function hideTip() {
  hoverTime = null;
  $('tip').style.display = 'none';
  dirty = true;
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadCsv() {
  const keys = Object.keys(METRICS);
  const lines = [['run', 'time_s', ...keys.map(k => k + (METRICS[k].unit ? `_${METRICS[k].unit}` : ''))].join(',')];
  const shown = [...new Set(panes.filter(p => p.run).map(p => p.run))];
  for (const run of shown)
    for (let k = 0; k < run.times.length; k++)
      lines.push([run.m.id, run.times[k], ...keys.map(key => (run.series[key] ? run.series[key][k] : ''))].join(','));
  downloadBlob(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }), `${PAGE.id || 'replay'}_${shown.map(r => r.m.id).join('_')}.csv`);
}

// ── Colour legend & picked link ───────────────────────────────────────────
function buildLegend() {
  const el = $('legend'), mode = COLOR_MODES.find(c => c.id === state.color) || COLOR_MODES[0];
  el.replaceChildren();
  if (mode.id === 'model') {
    el.append(textSpan(mode.note || 'the colours of the model'));
    el.firstChild.className = 'hint';
  } else {
    const ramp = document.createElement('div'), ends = document.createElement('div');
    ramp.className = 'ramp';
    ramp.style.background = `linear-gradient(to right, ${theme.ramp.join(', ')})`;
    ends.className = 'ends';
    ends.append(textSpan('0'), textSpan(`≥ ${+colorScale(mode.id).toPrecision(2)} ${mode.unit || ''}`));
    el.append(ramp, ends);
  }
}

function updatePickInfo() {
  const p = panes.find(p => p.run && p.sel.size);
  if (!p) { $('pick-info').textContent = ''; return; }
  const c = p.chain[[...p.sel].at(-1)];
  const name = c.shape.body >= 0 ? p.model.bodies[c.shape.body].name : c.shape.name;
  $('pick-info').textContent =
    `${p.run.m.label} · ${name}: ${p.speed[c.index].toPrecision(3)} m/s, bend ${p.bendOf(c).toFixed(1)}°` +
    (p.sel.size > 1 ? ` (+${p.sel.size - 1} more)` : '') + ' — Esc clears';
}

// Pane and shape under a pointer event.
function pickAt(ev) {
  const i = Math.min(panes.length - 1, Math.floor(ev.clientX / (window.innerWidth / panes.length)));
  const p = panes[i], rect = paneRect(i);
  if (!p.run || ev.clientY > rect.h) return { pane: p, hit: null };
  frame(rect);
  camera.updateMatrixWorld();
  p.scene.updateMatrixWorld();
  raycaster.setFromCamera(new THREE.Vector2((ev.clientX - rect.x) / rect.w * 2 - 1, 1 - ev.clientY / rect.h * 2), camera);
  const pxAngle = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / rect.h;
  return { pane: p, hit: p.pick(raycaster.ray.clone(), pxAngle) };
}

// ── Runs & panes ──────────────────────────────────────────────────────────
function onRunsChanged() {
  layout();
  buildChartLegend();
  buildLegend();
  setTime(state.time);
  saveHash();
}

// A run may name the playback speed that suits it (a 0.4 s crack and an 8 s orbit differ).
function preferSpeed(run) {
  if (!run || !run.m.speed) return;
  state.speed = run.m.speed;
  if (![...$('speed').options].some(o => +o.value === state.speed)) $('speed').appendChild(new Option(`${state.speed}×`, state.speed));
  $('speed').value = state.speed;
}

// The run to put next to `run`: the one it names, else another of its group, else any other.
function partnerOf(run) {
  return RUNS.find(r => r.m.id === run.m.partner) || RUNS.find(r => r !== run && r.m.group === run.m.group) ||
         RUNS.find(r => r !== run) || run;
}

// A run chosen by the visitor for a pane.  In the first pane it brings its own playback
// speed, and the view is fitted again if its motion occupies a different part of space.
async function chooseRun(pane, run) {
  const before = pane.run;
  if (!pane.index) preferSpeed(run);
  await pane.setRun(run);
  if (!pane.index && before && pane.run === run && boxesDiffer(before.m.bounds, run.m.bounds)) refit();
}

async function setCompare(on, run) {
  if (on && !(panes[0] && panes[0].run)) on = false;        // nothing to stand next to yet
  $('compare').checked = on;
  if (on && panes.length === 1) {
    panes.push(new Pane(1));
    layout();
    await panes[1].setRun(run || partnerOf(panes[0].run));
    refit();                                                // the panes are half as wide now
  } else if (!on && panes.length === 2) {
    panes.pop().dispose();
    layout();
    onRunsChanged();
    refit();
  }
}

// ── View state in the URL hash (reload or share the link to get the same view) ──
let hashTimer = 0;
function saveHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    if (!panes[0] || !panes[0].run) return;
    const h = new URLSearchParams();
    h.set('run', panes[0].run.m.id);
    if (panes[1] && panes[1].run) h.set('run2', panes[1].run.m.id);
    if (!state.playing) h.set('t', state.time.toFixed(4));
    h.set('speed', state.speed);
    h.set('color', state.color);
    h.set('metric', state.metric);
    if (state.thickness !== 1) h.set('thick', state.thickness);
    if (PAGE.floor && state.floor !== (PAGE.floor.show !== false)) h.set('floor', state.floor ? 1 : 0);
    if (!state.shadows) h.set('shadows', 0);
    if (state.theme !== 'dark') h.set('theme', state.theme);
    for (const t of PAGE.toggles || []) if (state.toggles[t.id] !== (t.on !== false)) h.set(t.id, state.toggles[t.id] ? 1 : 0);
    h.set('cam', [...camera.position.toArray(), ...controls.target.toArray()].map(v => v.toFixed(3)).join(','));
    try { history.replaceState(null, '', '#' + h.toString().replaceAll('%2C', ',')); }
    catch { /* Safari limits how often the URL may change; the next save catches up */ }
  }, 400);
}

// Selectors, checkboxes and buttons that depend on the page's data.
function buildControls() {
  const option = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; return o; };
  $('color').replaceChildren(...COLOR_MODES.map(c => option(c.id, c.label)));
  $('metric').replaceChildren(...Object.entries(METRICS).map(([key, d]) => option(key, d.label)));
  const speeds = PAGE.speeds || [0.05, 0.1, 0.25, 0.5, 1, 2];
  $('speed').replaceChildren(...speeds.map(s => option(s, `${s}×`)));
  if (PAGE.floor) {
    $('floor-label').lastElementChild.textContent = PAGE.floor.label || 'Floor';
    $('floor-label').title = PAGE.floor.title || '';
  } else $('floor-label').style.display = 'none';
  for (const t of PAGE.toggles || []) {
    const label = document.createElement('label'), box = document.createElement('input');
    box.type = 'checkbox';
    box.id = `toggle-${t.id}`;
    label.title = t.title || '';
    label.append(box, t.label);
    $('checks').appendChild(label);
    box.addEventListener('change', () => {
      state.toggles[t.id] = box.checked;
      panes.forEach(p => { p.applyToggles(); p.sel.clear(); });     // a picked link may be hidden now
      refresh();
      saveHash();
    });
  }
  VIEWS.forEach((v, i) => {
    const b = document.createElement('button');
    b.id = `view-${v.id}`;
    b.textContent = v.label;
    if (!i) b.title = 'Reset the view (R)';
    b.addEventListener('click', () => setView(v.id));
    $('views').insertBefore(b, $('shot'));
  });
  if (PAGE.thickness === false || !RUNS.some(r => r.model.geoms.some(g => g.chain))) $('thickness').closest('label').style.display = 'none';
  if (COLOR_MODES.length < 2) { $('color').closest('label').style.display = 'none'; $('legend').style.display = 'none'; }
  if (RUNS.length < 2) $('compare').closest('label').style.display = 'none';
}

async function init() {
  if (!RUNS.length) {
    showStatus('No run embedded in this page.\nGenerate one with\n  python scripts/make_replay_viewers.py');
    return;
  }
  if (typeof DecompressionStream === 'undefined') {
    showStatus('This browser cannot unpack the embedded data (no DecompressionStream).\nUse a current Chrome, Firefox or Safari.');
    return;
  }
  buildControls();
  const h = new URLSearchParams(location.hash.slice(1));
  const byId = id => RUNS.find(r => r.m.id === id);
  const has = (id, value) => !!$(id).querySelector(`[value="${CSS.escape(value)}"]`);

  const speed = +h.get('speed');
  if (h.has('speed') && Number.isFinite(speed) && speed > 0 && speed <= 100) state.speed = speed;
  if (h.has('color') && has('color', h.get('color'))) state.color = h.get('color');
  if (h.has('metric') && METRICS[h.get('metric')]) state.metric = h.get('metric');
  if (h.has('thick'))  state.thickness = Math.min(6, Math.max(1, +h.get('thick') || 1));
  if (h.has('floor'))  state.floor = h.get('floor') !== '0' && !!PAGE.floor;
  state.shadows = h.get('shadows') !== '0';
  state.theme   = h.get('theme') === 'light' ? 'light' : 'dark';
  for (const t of PAGE.toggles || []) {
    if (h.has(t.id)) state.toggles[t.id] = h.get(t.id) !== '0';
    $(`toggle-${t.id}`).checked = state.toggles[t.id];
  }
  if (!has('speed', String(state.speed))) $('speed').appendChild(new Option(`${state.speed}×`, state.speed));
  $('speed').value = state.speed;
  $('color').value = state.color;
  $('metric').value = state.metric;
  $('thickness').value = state.thickness;
  $('thickness-label').textContent = `${state.thickness}×`;
  $('floor').checked = state.floor;
  $('shadows').checked = state.shadows;
  $('light').checked = state.theme === 'light';
  if (window.innerWidth < 720) $('settings').open = false;      // leave a small screen to the view
  applyTheme();

  panes.push(new Pane(0));
  layout();
  const first = byId(h.get('run')) || RUNS[0];
  if (!h.has('speed')) preferSpeed(first);
  await panes[0].setRun(first);
  setView(VIEWS[0].id);
  if (h.has('run2') && byId(h.get('run2'))) await setCompare(true, byId(h.get('run2')));

  const cam = (h.get('cam') || '').split(',').map(Number);
  if (cam.length === 6 && cam.every(Number.isFinite)) {
    camera.position.fromArray(cam);
    controls.target.fromArray(cam, 3);
    controls.update();
  }
  if (h.has('t')) { setPlaying(false); setTime(+h.get('t') || 0); }
  else setTime(timeRange()[0]);

  requestAnimationFrame(animate);
}

function applyTheme() {
  theme = THEMES[state.theme];
  document.documentElement.dataset.theme = state.theme;
  lut      = buildLut(theme.ramp);
  dimLin   = new THREE.Color(theme.dim);
  pickLin  = new THREE.Color(theme.pick);
  bgLin    = new THREE.Color(theme.bg);
  trailLin = new THREE.Color(theme.trail);
  hitLin   = new THREE.Color(theme.hit);
  renderer.setClearColor(theme.bg);
  panes.forEach(p => p.applyTheme());
  buildLegend();
  refresh();
}

// ── Animation loop ────────────────────────────────────────────────────────
let lastTick = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTick) / 1000, 0.1);
  lastTick = now;

  if (state.playing) {
    const [lo, hi] = timeRange();
    let t = state.time + dt * state.speed;
    if (t >= hi) {
      if (state.loop) t = lo;
      else { t = hi; setPlaying(false); }
    }
    setTime(t);
  }

  controls.update();
  if (dirty) {
    dirty = false;
    render();
  }
}

// ── Event listeners ───────────────────────────────────────────────────────
$('btn-play').addEventListener('click', () => {
  const [lo, hi] = timeRange();
  if (!state.playing && state.time >= hi) setTime(lo);      // replay from the start
  setPlaying(!state.playing);
});
$('btn-start').addEventListener('click', () => { setTime(timeRange()[0]); saveHash(); });
$('btn-back').addEventListener('click', ev => stepFrames(ev.shiftKey ? -10 : -1));
$('btn-fwd').addEventListener('click', ev => stepFrames(ev.shiftKey ? 10 : 1));

$('scrubber').addEventListener('input', e => {
  const [lo, hi] = timeRange();
  setTime(lo + e.target.value / 10000 * (hi - lo));
  saveHash();
});
$('speed').addEventListener('change', e => { state.speed = +e.target.value; saveHash(); });
$('loop').addEventListener('change', e => { state.loop = e.target.checked; });

$('color').addEventListener('change', e => { state.color = e.target.value; buildLegend(); refresh(); saveHash(); });
$('metric').addEventListener('change', e => { state.metric = e.target.value; dirty = true; saveHash(); });
$('thickness').addEventListener('input', e => {
  state.thickness = +e.target.value;
  $('thickness-label').textContent = `${state.thickness}×`;
  refresh();
  saveHash();
});
$('compare').addEventListener('change', e => setCompare(e.target.checked));
$('floor').addEventListener('change', e => { state.floor = e.target.checked; refresh(); saveHash(); });
$('shadows').addEventListener('change', e => { state.shadows = e.target.checked; refresh(); saveHash(); });
$('light').addEventListener('change', e => { state.theme = e.target.checked ? 'light' : 'dark'; applyTheme(); saveHash(); });
$('csv').addEventListener('click', downloadCsv);
// The 3D view as a PNG: what is above the controls, centred as if no panel were over it.
$('shot').addEventListener('click', () => {
  const insets = [topInset, bottomInset, sideInset];
  topInset = bottomInset = sideInset = 0;
  render();
  [topInset, bottomInset, sideInset] = insets;
  dirty = true;
  const out = document.createElement('canvas');
  out.width  = canvas.width;
  out.height = Math.round(paneRect(0).h * renderer.getPixelRatio());
  out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height, 0, 0, out.width, out.height);
  const run = panes[0].run;
  out.toBlob(blob => downloadBlob(blob, `${PAGE.id || 'replay'}_${run ? run.m.id : 'view'}_t${state.time.toFixed(3)}.png`), 'image/png');
});

// plot: hover reads values, press/drag scrubs
let chartDrag = null;
$('chart').addEventListener('pointerdown', ev => {
  chartDrag = { wasPlaying: state.playing };
  setPlaying(false);
  $('chart').setPointerCapture(ev.pointerId);
  setTime(chartTime(ev));
});
$('chart').addEventListener('pointermove', ev => {
  if (chartDrag) setTime(chartTime(ev));
  showTip(ev);
});
$('chart').addEventListener('pointerup', () => {
  if (chartDrag && chartDrag.wasPlaying) setPlaying(true);
  chartDrag = null;
  saveHash();
});
$('chart').addEventListener('pointerleave', hideTip);

// 3D view: a click (no drag) reads a link, a double-click orbits around the point hit
let press = null;
canvas.addEventListener('pointerdown', ev => { press = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointerup', ev => {
  if (!press || Math.hypot(ev.clientX - press.x, ev.clientY - press.y) > 4 || ev.button !== 0) return;
  const { pane, hit } = pickAt(ev);
  const link = hit ? hit.link : null;
  if (link === null) panes.forEach(p => p.sel.clear());
  else if (ev.shiftKey) pane.sel.has(link) ? pane.sel.delete(link) : pane.sel.add(link);
  else {
    panes.forEach(p => p.sel.clear());
    pane.sel.add(link);
  }
  refresh();
});
canvas.addEventListener('dblclick', ev => {
  const { hit } = pickAt(ev);
  if (!hit) return;
  camera.position.add(hit.point.clone().sub(controls.target));
  controls.target.copy(hit.point);
  controls.update();
  saveHash();
});

// hand the keyboard back to the shortcuts below once a control was used with the mouse
document.addEventListener('click', e => { if (e.detail > 0) e.target.closest('button, input[type=checkbox], summary')?.blur(); });
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') e.target.blur(); });

window.addEventListener('keydown', e => {
  // a control that has the keyboard keeps its keys (Space on a checkbox, arrows on a slider)
  if (e.metaKey || e.ctrlKey || e.altKey || (e.target instanceof Element && e.target.closest('select, input, button, summary, a'))) return;
  if (e.key === ' ')               { e.preventDefault(); $('btn-play').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrames(e.shiftKey ? 10 : 1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); stepFrames(e.shiftKey ? -10 : -1); }
  else if (e.key === 'Home')       { setTime(timeRange()[0]); }
  else if (e.key === 'End')        { setPlaying(false); setTime(timeRange()[1]); }
  else if (e.key === 'Escape')     { panes.forEach(p => p.sel.clear()); refresh(); }
  else if (e.key === 'r')          { setView(VIEWS[0].id); }
  else if (e.key === 'c' && RUNS.length > 1) { setCompare(panes.length === 1); }
  else if (/^[1-9]$/.test(e.key) && RUNS[+e.key - 1] && panes[0]) { chooseRun(panes[0], RUNS[+e.key - 1]); }
});

window.addEventListener('resize', layout);
$('settings').addEventListener('toggle', layout);
window.addEventListener('error', e => showStatus(`Viewer error: ${e.message}`));
window.addEventListener('unhandledrejection', e => showStatus(`Viewer error: ${e.reason && e.reason.message || e.reason}`));

// ── Start ─────────────────────────────────────────────────────────────────
// For the DevTools console.  kinematics: largest distance [m] between this page's forward
// kinematics and MuJoCo's at the embedded check frames (body positions computed by MuJoCo from
// the same decoded coordinates).  axes: do the drawn capsules and cylinders of the first pane
// run along their own z, as shapeEnds() and MuJoCo have them?
async function selfTest() {
  let worst = 0;
  for (const run of RUNS) {
    const checks = run.m.checks || [];
    if (!checks.length) continue;
    await decode(run);
    const kin = run.kin, xpos = new Float64Array(kin.nb * 3), xquat = new Float64Array(kin.nb * 4);
    for (const c of checks) {
      fk(kin, run.q, c.frame * run.model.nq, xpos, xquat);
      worst = Math.max(worst, Math.hypot(xpos[c.body * 3] - c.pos[0], xpos[c.body * 3 + 1] - c.pos[1], xpos[c.body * 3 + 2] - c.pos[2]));
    }
  }
  const axes = panes[0].shapes.every(({ mesh, shape }) => {
    if ((shape.type !== 'capsule' && shape.type !== 'cylinder') || !(shape.size[1] > 0)) return true;
    mesh.geometry.computeBoundingBox();
    const box = mesh.geometry.boundingBox, cap = shape.type === 'capsule' ? shape.size[0] : 0;
    return Math.abs(box.max.z - (shape.size[1] + cap)) < 1e-6 && Math.abs(box.max.x - shape.size[0]) < 1e-6;
  });
  return { kinematics: worst, axes };
}

window.viewer = { PAGE, RUNS, state, panes, camera, controls, setTime, setView, setCompare, refresh, selfTest };   // for the DevTools console
init();
</script>
</body>
</html>
